name: Update 3D contribution calendar

on:
  schedule:
    - cron: "0 18 * * *" # Daily at 02:00 China Standard Time (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-3d-contrib
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "No changes to the 3D contribution calendar."
            exit 0
          fi
          git commit -m "chore: update 3D contribution calendar"
          git push
