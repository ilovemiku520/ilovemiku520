name: Update lifetime contribution calendar

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-3d-contrib.yml
      - scripts/update_contribution_chart.py
      - tests/test_contribution_chart.py
  schedule:
    - cron: "0 18 * * *" # Daily at 02:00 China Standard Time (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-3d-contrib
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check contribution date ranges and charts
        run: python -m unittest discover -s tests -v

      - name: Generate contributions from account creation to today
        run: python scripts/update_contribution_chart.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-green.svg assets/contribution-history.json
          if git diff --cached --quiet; then
            echo "No changes to the 3D contribution calendar."
            exit 0
          fi
          git commit -m "chore: update lifetime contribution calendar"
          git pull --rebase origin main
          git push
