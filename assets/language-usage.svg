<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-labelledby="title desc">
  <title id="title">Language usage across public repositories</title>
  <desc id="desc">Python 77.1 percent, JavaScript 9.8 percent, TypeScript 8.1 percent, CSS 2.4 percent, HTML 2.0 percent, Other 0.5 percent.</desc>
  <style>
    .label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .value { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #57606a; }
    .caption { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f0f6fc; }
      .value { fill: #b1bac4; }
      .caption { fill: #8c959f; }
    }
  </style>

  <g transform="rotate(-90 145 145)" fill="none" stroke-width="48">
    <circle cx="145" cy="145" r="88" pathLength="100" stroke="#d8dee4" opacity="0.35" />
    <circle cx="145" cy="145" r="88" pathLength="100" stroke="#3572A5" stroke-dasharray="77.1377 22.8623" stroke-dashoffset="-0.0000" />
    <circle cx="145" cy="145" r="88" pathLength="100" stroke="#F1E05A" stroke-dasharray="9.8261 90.1739" stroke-dashoffset="-77.1377" />
    <circle cx="145" cy="145" r="88" pathLength="100" stroke="#3178C6" stroke-dasharray="8.1476 91.8524" stroke-dashoffset="-86.9637" />
    <circle cx="145" cy="145" r="88" pathLength="100" stroke="#563D7C" stroke-dasharray="2.3698 97.6302" stroke-dashoffset="-95.1113" />
    <circle cx="145" cy="145" r="88" pathLength="100" stroke="#E34C26" stroke-dasharray="2.0228 97.9772" stroke-dashoffset="-97.4811" />
    <circle cx="145" cy="145" r="88" pathLength="100" stroke="#8C959F" stroke-dasharray="0.4961 99.5039" stroke-dashoffset="-99.5039" />
  </g>

  <text x="145" y="139" text-anchor="middle" class="label">Public repos</text>
  <text x="145" y="161" text-anchor="middle" class="value">language mix</text>

  <g transform="translate(300 47)">
    <circle cx="7" cy="7" r="7" fill="#3572A5" />
    <text x="25" y="12" class="label">Python</text>
    <text x="235" y="12" text-anchor="end" class="value">77.1%</text>

    <circle cx="7" cy="43" r="7" fill="#F1E05A" />
    <text x="25" y="48" class="label">JavaScript</text>
    <text x="235" y="48" text-anchor="end" class="value">9.8%</text>

    <circle cx="7" cy="79" r="7" fill="#3178C6" />
    <text x="25" y="84" class="label">TypeScript</text>
    <text x="235" y="84" text-anchor="end" class="value">8.1%</text>

    <circle cx="7" cy="115" r="7" fill="#563D7C" />
    <text x="25" y="120" class="label">CSS</text>
    <text x="235" y="120" text-anchor="end" class="value">2.4%</text>

    <circle cx="7" cy="151" r="7" fill="#E34C26" />
    <text x="25" y="156" class="label">HTML</text>
    <text x="235" y="156" text-anchor="end" class="value">2.0%</text>

    <circle cx="7" cy="187" r="7" fill="#8C959F" />
    <text x="25" y="192" class="label">Other</text>
    <text x="235" y="192" text-anchor="end" class="value">0.5%</text>
  </g>

  <text x="310" y="278" text-anchor="middle" class="caption">Updated automatically from GitHub Linguist byte counts</text>
</svg>
